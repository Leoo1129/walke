# Runs the whole stack: PostgreSQL (schema applied on first start) and the API,
# which also serves the built React frontend on http://localhost:3000.
#
#   cp .env.example .env   # set JWT_SECRET, optionally Stripe/SMTP keys
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: walke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walke}
      POSTGRES_DB: procurement
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./src/database/database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walke -d procurement"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://walke:${POSTGRES_PASSWORD:-walke}@db:5432/procurement
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:${HOST_PORT:-3000}}
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
