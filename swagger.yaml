openapi: 3.0.0
info:
  title: Walke API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
# ---------------- Auth ----------------
  /login:
    post:
      summary: Log in
      description: Authenticate with name and password, returns a JWT token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  example: johndoe
                password:
                  type: string
                  example: secret123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: name or password missing
        "401":
          description: Invalid credentials
        "500":
          description: Internal server error

# ---------------- Users ----------------
  /users:
    post:
      summary: Create a new user
      description: Register a new user account
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                password:
                  type: string
                street:
                  type: string
                city:
                  type: string
                postcode:
                  type: string
                country:
                  type: string
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  postcode:
                    type: string
                  country:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  last_updated:
                    type: string
                    format: date-time
        "400":
          description: name or password missing
        "500":
          description: Failed to create user

    get:
      summary: Get all users
      description: Retrieve a list of users
      tags:
        - users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    postcode:
                      type: string
                    country:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    last_updated:
                      type: string
                      format: date-time
        "404":
          description: No users found
        "500":
          description: Internal server error

  /users/{id}:
    get:
      summary: Get a user by ID
      description: Retrieve a single user
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  postcode:
                    type: string
                  country:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  last_updated:
                    type: string
                    format: date-time
        "404":
          description: User not found
        "500":
          description: Internal server error

    patch:
      summary: Update a user
      description: Update user information
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                street:
                  type: string
                city:
                  type: string
                postcode:
                  type: string
                country:
                  type: string
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  postcode:
                    type: string
                  country:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  last_updated:
                    type: string
                    format: date-time
        "400":
          description: No valid fields to update
        "404":
          description: User not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a user
      description: Delete a user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        "200":
          description: User deleted successfully
        "404":
          description: User not found
        "500":
          description: Internal server error

# ---------------- Cart ----------------
  /cart:
    post:
      summary: Add item to cart
      description: Add a product to the logged-in user's cart. If the product is already in the cart, the quantity is updated.
      tags:
        - cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: integer
                  example: 2
                quantity:
                  type: integer
                  example: 3
      responses:
        "201":
          description: Item added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
        "400":
          description: product_id or quantity missing, or quantity less than 1
        "401":
          description: Missing or invalid token
        "500":
          description: Internal server error

    get:
      summary: Get cart
      description: Retrieve all items in the logged-in user's cart
      tags:
        - cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of cart items (empty array if cart is empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: integer
                    product_id:
                      type: integer
                    quantity:
                      type: integer
        "401":
          description: Missing or invalid token
        "500":
          description: Internal server error

  /cart/{product_id}:
    patch:
      summary: Update cart item quantity
      description: Update the quantity of a product already in the logged-in user's cart
      tags:
        - cart
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  example: 5
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
        "400":
          description: quantity missing or less than 1
        "401":
          description: Missing or invalid token
        "404":
          description: Cart item not found
        "500":
          description: Internal server error

    delete:
      summary: Remove item from cart
      description: Remove a product from the logged-in user's cart
      tags:
        - cart
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Cart item removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
        "401":
          description: Missing or invalid token
        "404":
          description: Cart item not found
        "500":
          description: Internal server error

# ---------------- Products ----------------
  /products:
    post:
      summary: Create a new product
      description: Create a new product in the system. `tags` is optional. Requires authentication.
      tags:
        - products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - seller_id
              properties:
                name:
                  type: string
                  example: Running Shoes
                price:
                  type: number
                  example: 99.99
                seller_id:
                  type: integer
                  example: 1
                tags:
                  type: array
                  items:
                    type: string
                  example: ["sports", "shoes"]
                  description: Optional product tags
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Running Shoes
                  price:
                    type: number
                    example: 99.99
                  seller_id:
                    type: integer
                    example: 1
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["sports", "shoes"]
        "400":
          description: name, price, or seller_id missing
        "401":
          description: Missing or invalid token
        "500":
          description: Internal server error

    get:
      summary: Get all products
      description: Retrieve all products in the system
      tags:
        - products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Running Shoes
                    price:
                      type: number
                      example: 99.99
                    seller_id:
                      type: integer
                      example: 1
                    tags:
                      type: array
                      items:
                        type: string
                      example: ["sports", "shoes"]
        "404":
          description: No products found
        "500":
          description: Internal server error

  /products/{id}:
    get:
      summary: Get a product by ID
      description: Retrieve a single product by its ID
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Running Shoes
                  price:
                    type: number
                    example: 99.99
                  seller_id:
                    type: integer
                    example: 1
                  tags:
                    type: array
                    items:
                      type: string
                    example: ["sports", "shoes"]
        "404":
          description: Product not found
        "500":
          description: Internal server error

    patch:
      summary: Update a product
      description: Update one or more fields (`name`, `price`, `tags`) of a product
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: New Product Name
                price:
                  type: number
                  example: 120.5
                tags:
                  type: array
                  items:
                    type: string
                  example: ["updated", "sale"]
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  price:
                    type: number
                  seller_id:
                    type: integer
                  tags:
                    type: array
                    items:
                      type: string
        "400":
          description: No valid fields to update
        "404":
          description: Product not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a product
      description: Delete a product by ID
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  price:
                    type: number
                  seller_id:
                    type: integer
                  tags:
                    type: array
                    items:
                      type: string
        "404":
          description: Product not found
        "500":
          description: Internal server error

# ---------------- Orders ----------------
  /orders:
    post:
      summary: Create a new order
      description: Create a new order from a list of items. Requires authentication.
      tags:
        - orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - buyer_id
                - items
              properties:
                buyer_id:
                  type: integer
                  description: ID of the buyer
                  example: 1
                items:
                  type: array
                  description: List of products and quantities
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                        example: 2
                      quantity:
                        type: integer
                        example: 3
                total_price:
                  type: number
                  example: 29.97
                voucher_id:
                  type: integer
                  nullable: true
                  example: null
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                    example: pending
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        "400":
          description: buyer_id or items missing
        "401":
          description: Missing or invalid token
        "500":
          description: Failed to create order

    get:
      summary: Get all orders
      description: Retrieve a list of all orders
      tags:
        - orders
      responses:
        "200":
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    buyer_id:
                      type: integer
                    status:
                      type: string
                    total_price:
                      type: number
                    voucher_id:
                      type: integer
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
        "404":
          description: No orders found
        "500":
          description: Internal server error

  /orders/{id}:
    get:
      summary: Get an order by ID
      description: Retrieve a single order by its ID
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the order
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        "404":
          description: Order not found
        "500":
          description: Internal server error

    patch:
      summary: Update an order
      description: Update order fields (status, total_price, voucher_id)
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the order to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: shipped
                total_price:
                  type: number
                  example: 49.99
                voucher_id:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        "400":
          description: No valid fields to update
        "404":
          description: Order not found
        "500":
          description: Internal server error

    delete:
      summary: Delete an order
      description: Delete an order by its ID
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the order
      responses:
        "200":
          description: Order deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        "404":
          description: Order not found
        "500":
          description: Internal server error

# ---------------- Vouchers ----------------
  /vouchers:
    post:
      summary: Create a new voucher
      description: Create a discount voucher
      tags:
        - vouchers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - discount
              properties:
                name:
                  type: string
                  example: SUMMER10
                discount:
                  type: number
                  example: 10
                expiry:
                  type: string
                  format: date-time
                  example: 2026-12-31T23:59:59Z
                max_uses:
                  type: integer
                  example: 100
      responses:
        "201":
          description: Voucher created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: SUMMER10
                  discount:
                    type: number
                    example: 10
                  expiry:
                    type: string
                    format: date-time
                  max_uses:
                    type: integer
        "400":
          description: name or discount missing
        "500":
          description: Failed to create voucher

    get:
      summary: Get all vouchers
      description: Retrieve all vouchers
      tags:
        - vouchers
      responses:
        "200":
          description: List of vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    discount:
                      type: number
                    expiry:
                      type: string
                      format: date-time
                    max_uses:
                      type: integer
        "404":
          description: No vouchers found
        "500":
          description: Internal server error

  /vouchers/{id}:
    get:
      summary: Get a voucher by ID
      description: Retrieve a single voucher
      tags:
        - vouchers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Voucher ID
      responses:
        "200":
          description: Voucher found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  discount:
                    type: number
                  expiry:
                    type: string
                    format: date-time
                  max_uses:
                    type: integer
        "404":
          description: Voucher not found
        "500":
          description: Internal server error

    patch:
      summary: Update a voucher
      description: Update voucher fields (name, discount, expiry, max_uses)
      tags:
        - vouchers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Voucher ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: SUMMER20
                discount:
                  type: number
                  example: 20
                expiry:
                  type: string
                  format: date-time
                  example: 2027-01-01T00:00:00Z
                max_uses:
                  type: integer
                  example: 200
      responses:
        "200":
          description: Voucher updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  discount:
                    type: number
                  expiry:
                    type: string
                    format: date-time
                  max_uses:
                    type: integer
        "400":
          description: No valid fields to update
        "404":
          description: Voucher not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a voucher
      description: Delete a voucher by ID
      tags:
        - vouchers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Voucher ID
      responses:
        "200":
          description: Voucher deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  discount:
                    type: number
                  expiry:
                    type: string
                    format: date-time
                  max_uses:
                    type: integer
        "404":
          description: Voucher not found
        "500":
          description: Internal server error

# ---------------- System ----------------
  /health:
    get:
      summary: Health check
      description: Check if the API service is running
      tags:
        - system
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  uptime:
                    type: number
