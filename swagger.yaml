openapi: 3.0.0
info:
  title: Walke API
  version: 1.0.0

paths:
# ---------------- Auth ----------------
  /login:
    post:
      summary: Log in
      description: Authenticate with name and password, returns a JWT token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
              properties:
                name:
                  type: string
                  example: johndoe
                password:
                  type: string
                  example: secret123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: name or password missing
        "401":
          description: Invalid credentials
        "500":
          description: Internal server error

  /auth/verify-email:
    post:
      summary: Verify email address
      description: Verify a user's email using the token sent to their inbox
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: abc123verifytoken
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  message:
                    type: string
        "400":
          description: Invalid or expired token
        "500":
          description: Internal server error

  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Send a password reset email to the user
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: user@example.com
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: email missing
        "500":
          description: Internal server error

  /auth/reset-password/{token}:
    get:
      summary: Validate reset token
      description: Check whether a password reset token is valid and unexpired
      tags:
        - auth
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Password reset token
      responses:
        "200":
          description: Token validity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
        "500":
          description: Internal server error

  /auth/reset-password:
    post:
      summary: Reset password
      description: Set a new password using a valid reset token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  example: newpassword123
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid or expired token
        "500":
          description: Internal server error

# ---------------- Users ----------------
  /users:
    post:
      summary: Create a new user
      description: Register a new user account. A verification email is sent before the account is active.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - password
                - email
              properties:
                name:
                  type: string
                password:
                  type: string
                email:
                  type: string
                  example: user@example.com
                street:
                  type: string
                city:
                  type: string
                postcode:
                  type: string
                country:
                  type: string
                bio:
                  type: string
      responses:
        "201":
          description: User registered — verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification email sent
        "400":
          description: name, password, or email missing
        "409":
          description: Name or email already in use
        "500":
          description: Failed to create user

    get:
      summary: Get all users
      description: Retrieve a list of users. Optionally filter by name.
      tags:
        - users
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter users by name (partial match)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    postcode:
                      type: string
                    country:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    last_updated:
                      type: string
                      format: date-time
                    is_active:
                      type: boolean
                    is_admin:
                      type: boolean
                    logo_url:
                      type: string
                      nullable: true
                    bio:
                      type: string
                      nullable: true
        "404":
          description: No users found
        "500":
          description: Internal server error

  /users/{id}:
    get:
      summary: Get a user by ID
      description: Retrieve a single user
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  postcode:
                    type: string
                  country:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  last_updated:
                    type: string
                    format: date-time
                  logo_url:
                    type: string
                    nullable: true
                  bio:
                    type: string
                    nullable: true
                  email:
                    type: string
                  email_verified:
                    type: boolean
        "404":
          description: User not found
        "500":
          description: Internal server error

    patch:
      summary: Update a user
      description: Update user information. Requires authentication.
      tags:
        - users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                street:
                  type: string
                city:
                  type: string
                postcode:
                  type: string
                country:
                  type: string
                logo_url:
                  type: string
                  nullable: true
                bio:
                  type: string
                  nullable: true
                email:
                  type: string
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  street:
                    type: string
                  city:
                    type: string
                  postcode:
                    type: string
                  country:
                    type: string
                  logo_url:
                    type: string
                    nullable: true
                  bio:
                    type: string
                    nullable: true
                  email:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  last_updated:
                    type: string
                    format: date-time
        "400":
          description: No valid fields to update
        "401":
          description: Missing or invalid token
        "404":
          description: User not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a user
      description: Soft-delete a user (sets is_active to false). Requires authentication.
      tags:
        - users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  is_active:
                    type: boolean
                    example: false
        "401":
          description: Missing or invalid token
        "404":
          description: User not found
        "500":
          description: Internal server error

# ---------------- Cart ----------------
  /cart:
    post:
      summary: Add item to cart
      description: Add a product to the logged-in user's cart. If the product is already in the cart, the quantity is updated.
      tags:
        - cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: integer
                  example: 2
                quantity:
                  type: integer
                  example: 3
      responses:
        "201":
          description: Item added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
        "400":
          description: product_id or quantity missing, or quantity less than 1
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "500":
          description: Internal server error

    get:
      summary: Get cart
      description: Retrieve all items in the logged-in user's cart
      tags:
        - cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of cart items (empty array if cart is empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    product_id:
                      type: integer
                    quantity:
                      type: integer
                    product_name:
                      type: string
                    price:
                      type: number
                    image_url:
                      type: string
                      nullable: true
        "401":
          description: Missing or invalid token
        "500":
          description: Internal server error

  /cart/{product_id}:
    patch:
      summary: Update cart item quantity
      description: Update the quantity of a product already in the logged-in user's cart
      tags:
        - cart
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  example: 5
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
        "400":
          description: quantity missing or less than 1
        "401":
          description: Missing or invalid token
        "404":
          description: Cart item not found
        "500":
          description: Internal server error

    delete:
      summary: Remove item from cart
      description: Remove a product from the logged-in user's cart
      tags:
        - cart
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Cart item removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  product_id:
                    type: integer
                  quantity:
                    type: integer
        "401":
          description: Missing or invalid token
        "404":
          description: Cart item not found
        "500":
          description: Internal server error

# ---------------- Products ----------------
  /products:
    post:
      summary: Create a new product
      description: Create a new product. Requires a verified account.
      tags:
        - products
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - seller_id
              properties:
                name:
                  type: string
                  example: Running Shoes
                price:
                  type: number
                  example: 99.99
                seller_id:
                  type: integer
                  example: 1
                tags:
                  type: array
                  items:
                    type: string
                  example: ["sports", "shoes"]
                image_url:
                  type: string
                  nullable: true
                  example: /uploads/abc123.webp
                business_id:
                  type: integer
                  nullable: true
                  example: 2
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: name, price, or seller_id missing
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "500":
          description: Internal server error

    get:
      summary: Get all products
      description: Retrieve all products. Optionally filter by seller or business.
      tags:
        - products
      parameters:
        - name: seller_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter products by seller ID
        - name: business_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter products by business ID
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "404":
          description: No products found
        "500":
          description: Internal server error

  /products/{id}:
    get:
      summary: Get a product by ID
      description: Retrieve a single product by its ID
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
        "500":
          description: Internal server error

    patch:
      summary: Update a product
      description: Update one or more product fields. Requires a verified account.
      tags:
        - products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: New Product Name
                price:
                  type: number
                  example: 120.5
                tags:
                  type: array
                  items:
                    type: string
                  example: ["updated", "sale"]
                image_url:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: No valid fields to update
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "404":
          description: Product not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a product
      description: Soft-delete a product (sets is_active to false). Requires a verified account.
      tags:
        - products
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Product ID
      responses:
        "200":
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "404":
          description: Product not found
        "500":
          description: Internal server error

# ---------------- Orders ----------------
  /orders:
    post:
      summary: Place an order from cart
      description: |
        Creates an order from the logged-in user's cart. Optionally apply a voucher by code.
        Clears the cart on success.

        Supports content negotiation via the `Accept` header:
        - `Accept: application/json` (default) — returns JSON
        - `Accept: application/xml` — returns a UBL 2.1 Order XML
      tags:
        - orders
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                voucher_code:
                  type: string
                  nullable: true
                  description: Optional voucher code to apply. discount < 1 is a percentage off, discount >= 1 is a flat amount off.
                  example: SUMMER10
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                    example: pending
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id:
                          type: integer
                        quantity:
                          type: integer
                        price:
                          type: number
                        product_name:
                          type: string
                        seller_id:
                          type: integer
            application/xml:
              schema:
                type: object
                xml:
                  name: Order
                description: UBL 2.1 Order XML with buyer address, seller parties, order lines, and monetary totals
        "400":
          description: Cart is empty or voucher invalid/expired
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "500":
          description: Failed to create order

    get:
      summary: Get all orders
      description: Admins receive every order. Other users receive the orders they placed, or with `seller_id` set to their own id, the orders containing their products.
      tags:
        - orders
      parameters:
        - name: seller_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter orders that contain items from this seller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    buyer_id:
                      type: integer
                    buyer_name:
                      type: string
                    status:
                      type: string
                    total_price:
                      type: number
                    voucher_id:
                      type: integer
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: No orders found
        "500":
          description: Internal server error

  /orders/{id}:
    get:
      summary: Get an order by ID
      description: |
        Retrieve a single order by its ID. Supports content negotiation:
        - `Accept: application/json` (default) — returns order fields
        - `Accept: application/xml` — returns UBL 2.1 Order XML with buyer, seller, and line item details
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
            application/xml:
              schema:
                type: object
                xml:
                  name: Order
                description: UBL 2.1 Order XML
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: Order not found
        "500":
          description: Internal server error

    patch:
      summary: Update an order
      description: Update order fields (status, total_price, voucher_id). Admin only.
      tags:
        - orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: confirmed
                total_price:
                  type: number
                  example: 49.99
                voucher_id:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        "400":
          description: No valid fields to update
        "401":
          description: Missing or invalid token
        "403":
          description: Admin access required
        "404":
          description: Order not found
        "500":
          description: Internal server error

    delete:
      summary: Delete an order
      description: Delete an order by its ID. Admin only.
      tags:
        - orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      responses:
        "200":
          description: Order deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  buyer_id:
                    type: integer
                  status:
                    type: string
                  total_price:
                    type: number
                  voucher_id:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Missing or invalid token
        "403":
          description: Admin access required
        "404":
          description: Order not found
        "500":
          description: Internal server error

  /orders/{id}/response:
    post:
      summary: Submit order response
      description: |
        Seller submits a response to an order. The seller must have items in the order.
        - `AB` — accepted
        - `RE` — rejected
        - `IP` — request more information (triggers chat)

        Supports content negotiation:
        - `Accept: application/json` (default)
        - `Accept: application/xml` — returns UBL 2.1 OrderResponse XML
      tags:
        - orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - response_code
              properties:
                response_code:
                  type: string
                  enum: [AB, RE, IP]
                  example: AB
                note:
                  type: string
                  nullable: true
                  example: Will dispatch tomorrow
      responses:
        "201":
          description: Response recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  seller_id:
                    type: integer
                  response_code:
                    type: string
                  note:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
            application/xml:
              schema:
                type: object
                xml:
                  name: OrderResponse
                description: UBL 2.1 OrderResponse XML
        "400":
          description: Invalid response_code
        "401":
          description: Missing or invalid token
        "403":
          description: Seller has no items in this order or email not verified
        "404":
          description: Order not found
        "500":
          description: Internal server error

    get:
      summary: Get order response
      description: |
        Retrieve the seller's response to an order. Supports content negotiation:
        - `Accept: application/json` (default)
        - `Accept: application/xml` — returns UBL 2.1 OrderResponse XML
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order response found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  seller_id:
                    type: integer
                  response_code:
                    type: string
                  note:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
            application/xml:
              schema:
                type: object
                xml:
                  name: OrderResponse
                description: UBL 2.1 OrderResponse XML
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: No response found for this order
        "500":
          description: Internal server error

  /orders/{id}/responses:
    get:
      summary: Get all responses for an order
      description: Retrieve all seller responses for a given order
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of order responses
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    order_id:
                      type: integer
                    seller_id:
                      type: integer
                    seller_name:
                      type: string
                    response_code:
                      type: string
                    note:
                      type: string
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: Order not found
        "500":
          description: Internal server error

  /orders/{id}/cancel:
    post:
      summary: Cancel an order
      description: |
        Buyer cancels their own order. Updates order status to `cancelled`.

        Supports content negotiation:
        - `Accept: application/json` (default)
        - `Accept: application/xml` — returns UBL 2.1 OrderCancellation XML
      tags:
        - orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  example: Changed my mind
      responses:
        "201":
          description: Order cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  buyer_id:
                    type: integer
                  reason:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
            application/xml:
              schema:
                type: object
                xml:
                  name: OrderCancellation
                description: UBL 2.1 OrderCancellation XML
        "400":
          description: Order is already cancelled
        "401":
          description: Missing or invalid token
        "403":
          description: Only the buyer can cancel this order
        "404":
          description: Order not found
        "500":
          description: Internal server error

    get:
      summary: Get order cancellation
      description: |
        Retrieve the cancellation document for an order. Supports content negotiation:
        - `Accept: application/json` (default)
        - `Accept: application/xml` — returns UBL 2.1 OrderCancellation XML
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cancellation found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  order_id:
                    type: integer
                  buyer_id:
                    type: integer
                  reason:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
            application/xml:
              schema:
                type: object
                xml:
                  name: OrderCancellation
                description: UBL 2.1 OrderCancellation XML
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: No cancellation found for this order
        "500":
          description: Internal server error

  /orders/{id}/xml-email:
    post:
      summary: Email an order XML document
      description: Send a UBL 2.1 XML document (order, response, or cancellation) to the specified email address
      tags:
        - orders
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - email
              properties:
                type:
                  type: string
                  enum: [order, response, cancel]
                  example: order
                email:
                  type: string
                  example: buyer@example.com
      responses:
        "200":
          description: Email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: type or email missing, or invalid type
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: Order or document not found
        "500":
          description: Internal server error

# ---------------- Order Chat ----------------
  /orders/{id}/chats:
    get:
      summary: Get all chats for an order
      description: Retrieve all negotiation chats associated with an order. Requires authentication.
      tags:
        - chat
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
      responses:
        "200":
          description: List of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    order_id:
                      type: integer
                    seller_id:
                      type: integer
                    seller_name:
                      type: string
                    status:
                      type: string
                      example: open
                    current_turn:
                      type: string
                      enum: [buyer, seller]
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: Order not found
        "500":
          description: Internal server error

  /orders/{id}/chat/{seller_id}:
    post:
      summary: Open a chat with a seller
      description: Start a negotiation chat between the buyer and a seller for this order. Requires a verified account.
      tags:
        - chat
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
        - name: seller_id
          in: path
          required: true
          schema:
            type: integer
          description: Seller ID
      responses:
        "201":
          description: Chat opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "404":
          description: Order or seller not found
        "409":
          description: Chat already exists
        "500":
          description: Internal server error

    get:
      summary: Get chat messages
      description: Retrieve the full chat thread between buyer and a seller for this order. Requires authentication.
      tags:
        - chat
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
        - name: seller_id
          in: path
          required: true
          schema:
            type: integer
          description: Seller ID
      responses:
        "200":
          description: Chat with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "401":
          description: Missing or invalid token
        "403":
          description: User is not the buyer, a seller in this order, or an admin
        "404":
          description: Chat not found
        "500":
          description: Internal server error

  /orders/{id}/chat/{seller_id}/message:
    post:
      summary: Send a chat message
      description: Send a message in the negotiation chat. Requires a verified account.
      tags:
        - chat
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
        - name: seller_id
          in: path
          required: true
          schema:
            type: integer
          description: Seller ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: Can you ship by Friday?
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  sender_id:
                    type: integer
                  sender_role:
                    type: string
                    enum: [buyer, seller]
                  message:
                    type: string
                  action:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  sender_name:
                    type: string
        "400":
          description: message missing or chat is not in your turn
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "404":
          description: Chat not found
        "500":
          description: Internal server error

  /orders/{id}/chat/{seller_id}/finalize:
    post:
      summary: Finalize a chat
      description: |
        Take a final action on a negotiation chat. Requires a verified account.
        - `accept` / `reject` — seller actions
        - `confirm` / `cancel` — buyer actions
      tags:
        - chat
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Order ID
        - name: seller_id
          in: path
          required: true
          schema:
            type: integer
          description: Seller ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [accept, reject, confirm, cancel]
                  example: accept
      responses:
        "200":
          description: Chat finalized
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                  chatStatus:
                    type: string
        "400":
          description: Invalid action or not your turn
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "404":
          description: Chat not found
        "500":
          description: Internal server error

# ---------------- Vouchers ----------------
  /vouchers:
    post:
      summary: Create a new voucher
      description: Create a discount voucher. Requires a verified account.
      tags:
        - vouchers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - discount
              properties:
                name:
                  type: string
                  example: SUMMER10
                discount:
                  type: number
                  description: "< 1 = percentage off (e.g. 0.1 = 10%), >= 1 = flat amount off (e.g. 20 = $20 off)"
                  example: 0.1
                expiry:
                  type: string
                  format: date-time
                  example: 2026-12-31T23:59:59Z
                max_uses:
                  type: integer
                  example: 100
                business_id:
                  type: integer
                  nullable: true
                  description: Restrict voucher to a specific business
      responses:
        "201":
          description: Voucher created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "400":
          description: name or discount missing
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "409":
          description: Voucher name already in use
        "500":
          description: Failed to create voucher

    get:
      summary: Get all vouchers
      description: Retrieve all vouchers
      tags:
        - vouchers
      responses:
        "200":
          description: List of vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voucher"
        "404":
          description: No vouchers found
        "500":
          description: Internal server error

  /vouchers/{id}:
    get:
      summary: Get a voucher by ID
      description: Retrieve a single voucher
      tags:
        - vouchers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Voucher ID
      responses:
        "200":
          description: Voucher found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "404":
          description: Voucher not found
        "500":
          description: Internal server error

    patch:
      summary: Update a voucher
      description: Update voucher fields. Requires a verified account.
      tags:
        - vouchers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Voucher ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: SUMMER20
                discount:
                  type: number
                  example: 0.2
                expiry:
                  type: string
                  format: date-time
                  example: 2027-01-01T00:00:00Z
                max_uses:
                  type: integer
                  example: 200
      responses:
        "200":
          description: Voucher updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "400":
          description: No valid fields to update
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "404":
          description: Voucher not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a voucher
      description: Delete a voucher by ID. Requires a verified account.
      tags:
        - vouchers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Voucher ID
      responses:
        "200":
          description: Voucher deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "404":
          description: Voucher not found
        "500":
          description: Internal server error

# ---------------- Businesses ----------------
  /businesses:
    post:
      summary: Create a business
      description: Create a new business. The authenticated user becomes the owner. Requires a verified account.
      tags:
        - businesses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Acme Corp
                bio:
                  type: string
                  nullable: true
                logo_url:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Business created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: name missing
        "401":
          description: Missing or invalid token
        "403":
          description: Email not verified
        "409":
          description: Business name already in use
        "500":
          description: Internal server error

    get:
      summary: Get all businesses
      description: Retrieve all active businesses. Optionally filter by member.
      tags:
        - businesses
      parameters:
        - name: member_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter businesses that include this user as a member
      responses:
        "200":
          description: List of businesses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"
        "404":
          description: No businesses found
        "500":
          description: Internal server error

  /businesses/{id}:
    get:
      summary: Get a business by ID
      description: Retrieve a single business with member count
      tags:
        - businesses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Business ID
      responses:
        "200":
          description: Business found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Business not found
        "500":
          description: Internal server error

    patch:
      summary: Update a business
      description: Update business details. Requires admin or owner role in the business.
      tags:
        - businesses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Business ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                bio:
                  type: string
                  nullable: true
                logo_url:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Business updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "400":
          description: No valid fields to update
        "401":
          description: Missing or invalid token
        "403":
          description: Insufficient role (admin or above required)
        "404":
          description: Business not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a business
      description: Soft-delete a business (sets is_active to false). Owner only.
      tags:
        - businesses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Business ID
      responses:
        "200":
          description: Business deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Missing or invalid token
        "403":
          description: Owner role required
        "404":
          description: Business not found
        "500":
          description: Internal server error

# ---------------- Business Members ----------------
  /businesses/{id}/members:
    get:
      summary: Get business members
      description: Retrieve all members of a business. Requires authentication.
      tags:
        - businesses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Business ID
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    logo_url:
                      type: string
                      nullable: true
                    role:
                      type: string
                      enum: [owner, admin, editor, viewer]
                    joined_at:
                      type: string
                      format: date-time
        "401":
          description: Missing or invalid token
        "404":
          description: Business not found
        "500":
          description: Internal server error

    post:
      summary: Add a member to a business
      description: Add a user to the business with a specified role. Requires admin or above.
      tags:
        - businesses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Business ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - role
              properties:
                user_id:
                  type: integer
                role:
                  type: string
                  enum: [admin, editor, viewer]
                  example: editor
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  business_id:
                    type: integer
                  user_id:
                    type: integer
                  role:
                    type: string
                  joined_at:
                    type: string
                    format: date-time
        "400":
          description: user_id or role missing
        "401":
          description: Missing or invalid token
        "403":
          description: Insufficient role (admin or above required)
        "404":
          description: Business or user not found
        "409":
          description: User is already a member
        "500":
          description: Internal server error

  /businesses/{id}/members/{user_id}:
    patch:
      summary: Update a member's role
      description: Change the role of an existing member. Requires admin or above.
      tags:
        - businesses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Business ID
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID of the member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [admin, editor, viewer]
                  example: admin
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  business_id:
                    type: integer
                  user_id:
                    type: integer
                  role:
                    type: string
                  joined_at:
                    type: string
                    format: date-time
        "401":
          description: Missing or invalid token
        "403":
          description: Insufficient role
        "404":
          description: Member not found
        "500":
          description: Internal server error

    delete:
      summary: Remove a member from a business
      description: Remove a user from the business. Requires admin or above.
      tags:
        - businesses
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Business ID
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID of the member to remove
      responses:
        "200":
          description: Member removed
        "401":
          description: Missing or invalid token
        "403":
          description: Insufficient role
        "404":
          description: Member not found
        "500":
          description: Internal server error

