          type: array
          items:
            type: string
        image_url:
          type: string
          nullable: true
        business_id:
          type: integer
          nullable: true
        business_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

